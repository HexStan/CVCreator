services:
  app:
    image: ghcr.io/hexstan/cvcreator:latest
    container_name: cv-creator
    ports:
      - "5000:5000"
    volumes:
      - data:/app/data
      # 映射管理员预置的字体目录
      - ./backend/fonts:/app/fonts:ro
    environment:
      - SECRET_KEY=change-me-in-production
      - FLASK_DEBUG=false
      # - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173

volumes:
  data:
